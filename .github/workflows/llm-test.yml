name: Local LLM Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to the local model"
        required: true
        type: string
        default: "Explain what a large language model is in one sentence."
      model:
        description: "Ollama model to run"
        required: true
        type: string
        default: "qwen2.5:1.5b"

permissions:
  contents: read

jobs:
  test-llm:
    name: Run local LLM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Ollama did not start."
          cat /tmp/ollama.log
          exit 1

      - name: Download model
        env:
          MODEL: ${{ inputs.model }}
        run: |
          echo "Downloading $MODEL..."
          ollama pull "$MODEL"

      - name: Run prompt
        env:
          MODEL: ${{ inputs.model }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          echo "Running $MODEL locally on the GitHub Actions runner..."
          echo ""
          ollama run "$MODEL" "$PROMPT"

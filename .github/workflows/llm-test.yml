name: LLM Test

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send to the LLM"
        required: true
        type: string
        default: "Reply with exactly: LLM connection successful."
      model:
        description: "Model ID (leave blank to use the LLM_MODEL repository variable)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-llm:
    name: Test LLM API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call LLM and verify response
        env:
          LLM_API_URL: ${{ vars.LLM_API_URL }}
          LLM_MODEL: ${{ inputs.model || vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          api_url = os.environ.get("LLM_API_URL", "").strip()
          model = os.environ.get("LLM_MODEL", "").strip()
          api_key = os.environ.get("LLM_API_KEY", "")
          prompt = os.environ.get("PROMPT", "").strip()

          missing = [
              name for name, value in (
                  ("LLM_API_URL repository variable", api_url),
                  ("LLM_MODEL repository variable or workflow input", model),
                  ("LLM_API_KEY repository secret", api_key),
                  ("prompt", prompt),
              ) if not value
          ]
          if missing:
              print("::error::Missing configuration: " + ", ".join(missing))
              sys.exit(1)

          payload = {
              "model": model,
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.2,
          }
          request = urllib.request.Request(
              api_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )

          print(f"Testing model: {model}")
          print(f"API endpoint: {api_url}")
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", errors="replace")
              print(f"::error::LLM API returned HTTP {error.code}: {detail[:1500]}")
              sys.exit(1)
          except Exception as error:
              print(f"::error::LLM request failed: {error}")
              sys.exit(1)

          try:
              answer = result["choices"][0]["message"]["content"]
          except (KeyError, IndexError, TypeError):
              print("::error::Unexpected response format; expected an OpenAI-compatible chat completions response.")
              print(json.dumps(result, indent=2)[:3000])
              sys.exit(1)

          if isinstance(answer, list):
              answer = "\n".join(
                  item.get("text", "") for item in answer
                  if isinstance(item, dict)
              )
          if not isinstance(answer, str) or not answer.strip():
              print("::error::The model returned an empty response.")
              sys.exit(1)

          print("\n--- Model response ---")
          print(answer)
          print("\n::notice::LLM API test passed.")
          PY
